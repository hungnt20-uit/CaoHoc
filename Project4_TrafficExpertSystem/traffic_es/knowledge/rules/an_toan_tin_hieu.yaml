# Nhóm hành vi: AN TOÀN & TÍN HIỆU — Nghị định 168/2024/NĐ-CP
# GPLX đã tách sang giay_to.yaml (P2.4). Bổ sung đèn vàng + hiệu lệnh CSGT (P0.2).
rules:
  - id: R_MU_XEMAY
    nhom: mu_bao_hiem
    ap_dung_loai_xe: [xe_may]
    dieu_kien:
      - "nguoi.khong_mu_bao_hiem == true"
    ket_luan:
      hanh_vi: "Người điều khiển/chở người trên xe máy không đội mũ bảo hiểm hoặc đội không cài quai đúng quy cách"
      tien_phat_min: 400000
      tien_phat_max: 600000
      can_cu: { nghi_dinh: "168/2024/NĐ-CP", dieu: 7, khoan: 2, diem: "h" }

  - id: R_DAY_OTO
    nhom: day_an_toan
    ap_dung_loai_xe: [o_to]
    dieu_kien:
      - "nguoi.khong_day_an_toan == true"
    ket_luan:
      hanh_vi: "Không thắt dây đai an toàn khi điều khiển ô tô chạy trên đường"
      tien_phat_min: 800000
      tien_phat_max: 1000000
      can_cu: { nghi_dinh: "168/2024/NĐ-CP", dieu: 6, khoan: 3, diem: "k" }

  - id: R_DENDO_OTO
    nhom: tin_hieu
    ap_dung_loai_xe: [o_to]
    dieu_kien:
      - "hanhvi.vuot_den_do == true"
    ket_luan:
      hanh_vi: "Ô tô không chấp hành hiệu lệnh của đèn tín hiệu giao thông (vượt đèn đỏ)"
      tien_phat_min: 18000000
      tien_phat_max: 20000000
      phat_bo_sung: { tru_diem: 4 }
      can_cu: { nghi_dinh: "168/2024/NĐ-CP", dieu: 6, khoan: 9, diem: "b" }

  - id: R_DENDO_XEMAY
    nhom: tin_hieu
    ap_dung_loai_xe: [xe_may]
    dieu_kien:
      - "hanhvi.vuot_den_do == true"
    ket_luan:
      hanh_vi: "Xe máy không chấp hành hiệu lệnh của đèn tín hiệu giao thông (vượt đèn đỏ)"
      tien_phat_min: 4000000
      tien_phat_max: 6000000
      phat_bo_sung: { tru_diem: 4 }
      can_cu: { nghi_dinh: "168/2024/NĐ-CP", dieu: 7, khoan: 7, diem: "c" }

  - id: R_DENVANG_OTO
    nhom: tin_hieu
    ap_dung_loai_xe: [o_to]
    dieu_kien:
      - "hanhvi.vuot_den_vang == true"
    ket_luan:
      hanh_vi: "Ô tô không chấp hành hiệu lệnh đèn vàng / đèn tín hiệu giao thông"
      tien_phat_min: 18000000
      tien_phat_max: 20000000
      phat_bo_sung: { tru_diem: 4 }
      can_cu: { nghi_dinh: "168/2024/NĐ-CP", dieu: 6, khoan: 9, diem: "b" }

  - id: R_DENVANG_XEMAY
    nhom: tin_hieu
    ap_dung_loai_xe: [xe_may]
    dieu_kien:
      - "hanhvi.vuot_den_vang == true"
    ket_luan:
      hanh_vi: "Xe máy không chấp hành hiệu lệnh đèn vàng / đèn tín hiệu giao thông"
      tien_phat_min: 4000000
      tien_phat_max: 6000000
      phat_bo_sung: { tru_diem: 4 }
      can_cu: { nghi_dinh: "168/2024/NĐ-CP", dieu: 7, khoan: 7, diem: "c" }

  - id: R_CSGT_OTO
    nhom: tin_hieu
    ap_dung_loai_xe: [o_to]
    dieu_kien:
      - "hanhvi.khong_chap_hanh_csgt == true"
    ket_luan:
      hanh_vi: "Ô tô không chấp hành hiệu lệnh, hướng dẫn của CSGT / người điều khiển giao thông"
      tien_phat_min: 18000000
      tien_phat_max: 20000000
      phat_bo_sung: { tru_diem: 4 }
      can_cu: { nghi_dinh: "168/2024/NĐ-CP", dieu: 6, khoan: 9, diem: "c" }

  - id: R_CSGT_XEMAY
    nhom: tin_hieu
    ap_dung_loai_xe: [xe_may]
    dieu_kien:
      - "hanhvi.khong_chap_hanh_csgt == true"
    ket_luan:
      hanh_vi: "Xe máy không chấp hành hiệu lệnh, hướng dẫn của CSGT / người điều khiển giao thông"
      tien_phat_min: 4000000
      tien_phat_max: 6000000
      phat_bo_sung: { tru_diem: 4 }
      can_cu: { nghi_dinh: "168/2024/NĐ-CP", dieu: 7, khoan: 7, diem: "d" }
